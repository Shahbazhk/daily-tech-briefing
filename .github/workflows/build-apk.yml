name: Build Android APK

on:
  workflow_dispatch: {} # manual trigger from the Actions tab
  push:
    branches: [master]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write # needed to attach the APK to a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # No gradlew is committed (its binary wrapper jar isn't hand-authorable), so this
          # installs Gradle itself and puts it on PATH.
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-tech-updates-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to a GitHub Release (easiest way to download on a phone)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "app-latest" --yes 2>/dev/null || true
          gh release create "app-latest" \
            android-app/app/build/outputs/apk/debug/app-debug.apk \
            --title "Daily Tech Updates - latest debug build" \
            --notes "Auto-built debug APK from the android-app/ source. On your phone: open this release page, download app-debug.apk, then open it to install (you may need to allow \"install unknown apps\" for your browser). This is a debug build, self-signed automatically - fine for personal installs, not for Play Store distribution."
