name: Daily Tech Briefing


on:
  schedule:
    # 00:00 UTC = 03:00 AM AST (Saudi Arabia, UTC+3) — a 5-hour buffer before
    # the 08:00 AM AST delivery target. GitHub's `schedule` trigger is best-effort
    # and can be delayed by hours under load (seen: 3h27m delay on 2026-08-03,
    # which blew through the previous 2-hour buffer) — this buffer is sized to
    # absorb that plus slow LLM/TTS runs or retries.
    - cron: "0 0 * * *"
  workflow_dispatch: {} # allows manual "Run workflow" for testing

permissions:
  contents: write # needed only for the GitHub Release fallback step

jobs:
  build-episode:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg for WAV -> MP3, espeak-ng for Kokoro's phonemizer)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Install PyTorch (CPU-only build - the default PyPI wheel pulls in unused CUDA libs)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python deps
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline (collect -> script -> TTS -> publish)
        run: python pipeline/run_pipeline.py

      - name: Fallback - attach episode to a GitHub Release (only if Firebase isn't configured)
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%F)
          # Idempotent: a manual re-run on the same day (e.g. while testing) would otherwise
          # fail with "a release with the same tag name already exists".
          gh release delete "episode-$DATE" --yes 2>/dev/null || true
          gh release create "episode-$DATE" \
            pipeline/data/episode_*.mp3 \
            pipeline/data/transcript_*.json \
            --title "Daily Tech Briefing - $DATE" \
            --notes "Automated daily episode. Firebase publish was not configured, so the app should poll this release."
