name: Deploy Episode Website

on:
  release:
    # In practice this never fires: daily-episode.yml/daily-pm-episode.yml create their
    # releases with GITHUB_TOKEN, and GitHub suppresses the `release` event for other
    # workflows when the actor is GITHUB_TOKEN (anti-recursion). Those workflows instead
    # explicitly dispatch this workflow via `gh workflow run deploy-site.yml` after
    # publishing. Kept anyway for a human publishing a release by hand.
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install manifest-generation deps
        run: pip install -r site/requirements.txt

      - name: Generate episode manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python site/generate_manifest.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
